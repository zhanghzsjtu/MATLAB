<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Consolas,Menlo,monospace">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b8"/></marker></defs>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f2d3d">每个子模块为何不可或缺 (缺一则 50ns 同步失效)</text>
<rect x="30" y="60" width="125" height="80" rx="8" fill="#e377c2" opacity="0.15" stroke="#e377c2" stroke-width="2"/>
<text x="92.5" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#e377c2">BMCA</text>
<text x="92.5" y="102" text-anchor="middle" font-size="9" fill="#445">选定全网基准 GM</text>
<text x="92.5" y="117" text-anchor="middle" font-size="9" fill="#445">缺→不知以谁为准</text>
<rect x="167" y="60" width="125" height="80" rx="8" fill="#2ca02c" opacity="0.15" stroke="#2ca02c" stroke-width="2"/>
<text x="229.5" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2ca02c">HTSU</text>
<text x="229.5" y="102" text-anchor="middle" font-size="9" fill="#445">线上 SOF 硬打戳</text>
<text x="229.5" y="117" text-anchor="middle" font-size="9" fill="#445">缺→时间戳由软件引入抖动</text>
<rect x="304" y="60" width="125" height="80" rx="8" fill="#9467bd" opacity="0.15" stroke="#9467bd" stroke-width="2"/>
<text x="366.5" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#9467bd">Pdelay</text>
<text x="366.5" y="102" text-anchor="middle" font-size="9" fill="#445">P2P 测链路不对称</text>
<text x="366.5" y="117" text-anchor="middle" font-size="9" fill="#445">缺→双向延迟无法抵消</text>
<rect x="441" y="60" width="125" height="80" rx="8" fill="#D95319" opacity="0.15" stroke="#D95319" stroke-width="2"/>
<text x="503.5" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#D95319">TC</text>
<text x="503.5" y="102" text-anchor="middle" font-size="9" fill="#445">累加 residence 到 CF</text>
<text x="503.5" y="117" text-anchor="middle" font-size="9" fill="#445">缺→跨跳抖动累积</text>
<rect x="30" y="182" width="125" height="80" rx="8" fill="#ff7f0e" opacity="0.15" stroke="#ff7f0e" stroke-width="2"/>
<text x="92.5" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff7f0e">Servo</text>
<text x="92.5" y="224" text-anchor="middle" font-size="9" fill="#445">PI 闭环收敛 offset</text>
<text x="92.5" y="239" text-anchor="middle" font-size="9" fill="#445">缺→频率/相位永不对齐</text>
<rect x="167" y="182" width="125" height="80" rx="8" fill="#17becf" opacity="0.15" stroke="#17becf" stroke-width="2"/>
<text x="229.5" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#17becf">MAC glue</text>
<text x="229.5" y="224" text-anchor="middle" font-size="9" fill="#445">识别 0x88F7/提 msgType</text>
<text x="229.5" y="239" text-anchor="middle" font-size="9" fill="#445">缺→无法接入真实帧流</text>
<rect x="304" y="182" width="125" height="80" rx="8" fill="#0072BD" opacity="0.15" stroke="#0072BD" stroke-width="2"/>
<text x="366.5" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#0072BD">PHC</text>
<text x="366.5" y="224" text-anchor="middle" font-size="9" fill="#445">自由运行时间基准</text>
<text x="366.5" y="239" text-anchor="middle" font-size="9" fill="#445">缺→无统一时间面</text>
