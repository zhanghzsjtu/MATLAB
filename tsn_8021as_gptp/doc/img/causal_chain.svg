<text x="640.5" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">50ns 同步达成</text>
<line x1="366.5" y1="262" x2="640.5" y2="304" stroke="#0072BD" stroke-width="1.8" marker-end="url(#ah)"/>
