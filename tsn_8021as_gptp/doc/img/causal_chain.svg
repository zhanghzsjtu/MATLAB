<line x1="155" y1="222.0" x2="167" y2="222.0" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="292" y1="222.0" x2="304" y2="222.0" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#ah)"/>
